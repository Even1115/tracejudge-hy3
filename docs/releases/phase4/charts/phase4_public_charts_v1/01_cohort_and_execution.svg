<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
<title>Research cohort and paired execution accounting</title>
<desc>Two normalized bars show 42 natural and 15 counterfactual traces, then valid and invalid method outcomes.</desc>
<style>text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }</style>
<rect x="0.0" y="0.0" width="1200.0" height="720.0" fill="#ffffff" rx="0" />
<text x="60.0" y="70.0" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Research cohort and paired execution accounting</text>
<text x="60.0" y="105.0" font-size="17" font-weight="400" text-anchor="start" fill="#526078">Counts are shown on separate denominators; bars are normalized within each unit.</text>
<text x="60.0" y="210.0" font-size="21" font-weight="650" text-anchor="start" fill="#172033">Frozen traces (n=57)</text>
<rect x="260.0" y="170.0" width="618.9" height="58.0" fill="#2457C5" rx="8" />
<rect x="878.9" y="170.0" width="221.1" height="58.0" fill="#E08A2E" rx="8" />
<text x="569.5" y="206.0" font-size="17" font-weight="650" text-anchor="middle" fill="#ffffff">Natural 42</text>
<text x="989.5" y="206.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172033">Counterfactual 15</text>
<text x="260.0" y="255.0" font-size="16" font-weight="400" text-anchor="start" fill="#526078">Counterfactual parent clusters: 3</text>
<text x="60.0" y="430.0" font-size="21" font-weight="650" text-anchor="start" fill="#172033">Method pairs (n=285)</text>
<rect x="260.0" y="390.0" width="834.1" height="58.0" fill="#2D8A65" rx="8" />
<rect x="1094.1" y="390.0" width="5.9" height="58.0" fill="#C7463B" rx="0" />
<rect x="1100.0" y="390.0" width="0.0" height="58.0" fill="#7A8394" rx="0" />
<text x="677.1" y="426.0" font-size="17" font-weight="650" text-anchor="middle" fill="#ffffff">Valid judgment 283</text>
<text x="260.0" y="485.0" font-size="16" font-weight="400" text-anchor="start" fill="#526078">Provider error 2; other invalid 0</text>
<text x="60.0" y="620.0" font-size="18" font-weight="650" text-anchor="start" fill="#8A3B32">Exploratory · CAUTION · invalid outcomes remain in the full denominator</text>
</svg>
