<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
<title>Pre-registered paired comparisons</title>
<desc>Two natural and two counterfactual pre-registered comparisons are shown without equivalence claims.</desc>
<style>text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }</style>
<rect x="0.0" y="0.0" width="1200.0" height="720.0" fill="#ffffff" rx="0" />
<text x="55.0" y="62.0" font-size="29" font-weight="700" text-anchor="start" fill="#172033">Pre-registered Full TraceJudge paired comparisons</text>
<text x="55.0" y="96.0" font-size="16" font-weight="400" text-anchor="start" fill="#526078">Point estimates are percentage-point differences: Full minus baseline.</text>
<text x="300.0" y="150.0" font-size="19" font-weight="650" text-anchor="middle" fill="#172033">Natural traces · exact McNemar + Holm</text>
<text x="890.0" y="150.0" font-size="19" font-weight="650" text-anchor="middle" fill="#172033">Counterfactual · parent-cluster bootstrap</text>
<line x1="150.0" y1="190.0" x2="150.0" y2="535.0" stroke="#E2E6ED" stroke-width="1.5" />
<text x="150.0" y="565.0" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">-20</text>
<line x1="230.0" y1="190.0" x2="230.0" y2="535.0" stroke="#E2E6ED" stroke-width="1.5" />
<text x="230.0" y="565.0" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">-10</text>
<line x1="310.0" y1="190.0" x2="310.0" y2="535.0" stroke="#7A8394" stroke-width="1.5" />
<text x="310.0" y="565.0" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">+0</text>
<line x1="390.0" y1="190.0" x2="390.0" y2="535.0" stroke="#E2E6ED" stroke-width="1.5" />
<text x="390.0" y="565.0" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">+10</text>
<line x1="470.0" y1="190.0" x2="470.0" y2="535.0" stroke="#E2E6ED" stroke-width="1.5" />
<text x="470.0" y="565.0" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">+20</text>
<line x1="740.0" y1="190.0" x2="740.0" y2="535.0" stroke="#E2E6ED" stroke-width="1.5" />
<text x="740.0" y="565.0" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">-20</text>
<line x1="820.0" y1="190.0" x2="820.0" y2="535.0" stroke="#E2E6ED" stroke-width="1.5" />
<text x="820.0" y="565.0" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">-10</text>
<line x1="900.0" y1="190.0" x2="900.0" y2="535.0" stroke="#7A8394" stroke-width="1.5" />
<text x="900.0" y="565.0" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">+0</text>
<line x1="980.0" y1="190.0" x2="980.0" y2="535.0" stroke="#E2E6ED" stroke-width="1.5" />
<text x="980.0" y="565.0" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">+10</text>
<line x1="1060.0" y1="190.0" x2="1060.0" y2="535.0" stroke="#E2E6ED" stroke-width="1.5" />
<text x="1060.0" y="565.0" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">+20</text>
<text x="110.0" y="236.0" font-size="17" font-weight="650" text-anchor="start" fill="#172033">vs Test-only</text>
<circle cx="291.0" cy="270.0" r="7" fill="#2457C5" />
<text x="110.0" y="306.0" font-size="14" font-weight="400" text-anchor="start" fill="#526078">Δ -2.4 pp · n01/n10 0/1 · Holm p=1.000</text>
<text x="110.0" y="406.0" font-size="17" font-weight="650" text-anchor="start" fill="#172033">vs Direct LLM Judge</text>
<circle cx="310.0" cy="440.0" r="7" fill="#2457C5" />
<text x="110.0" y="476.0" font-size="14" font-weight="400" text-anchor="start" fill="#526078">Δ +0.0 pp · n01/n10 1/1 · Holm p=1.000</text>
<text x="700.0" y="236.0" font-size="17" font-weight="650" text-anchor="start" fill="#172033">vs Test-only</text>
<line x1="900.0" y1="270.0" x2="1060.0" y2="270.0" stroke="#E08A2E" stroke-width="5.0" />
<line x1="900.0" y1="263.0" x2="900.0" y2="277.0" stroke="#E08A2E" stroke-width="2.0" />
<line x1="1060.0" y1="263.0" x2="1060.0" y2="277.0" stroke="#E08A2E" stroke-width="2.0" />
<circle cx="1006.7" cy="270.0" r="7" fill="#172033" />
<text x="700.0" y="306.0" font-size="14" font-weight="400" text-anchor="start" fill="#526078">Δ +13.3 pp · 95% CI [+0.0, +20.0] · clusters=3</text>
<text x="700.0" y="406.0" font-size="17" font-weight="650" text-anchor="start" fill="#172033">vs Direct LLM Judge</text>
<line x1="900.0" y1="440.0" x2="900.0" y2="440.0" stroke="#E08A2E" stroke-width="5.0" />
<line x1="900.0" y1="433.0" x2="900.0" y2="447.0" stroke="#E08A2E" stroke-width="2.0" />
<line x1="900.0" y1="433.0" x2="900.0" y2="447.0" stroke="#E08A2E" stroke-width="2.0" />
<circle cx="900.0" cy="440.0" r="7" fill="#172033" />
<text x="700.0" y="476.0" font-size="14" font-weight="400" text-anchor="start" fill="#526078">Δ +0.0 pp · 95% CI [+0.0, +0.0] · clusters=3</text>
<text x="55.0" y="615.0" font-size="15" font-weight="400" text-anchor="start" fill="#526078">Natural comparisons report exact p-values, not effect-size confidence intervals.</text>
<text x="55.0" y="646.0" font-size="16" font-weight="650" text-anchor="start" fill="#8A3B32">A non-significant result or a [0, 0] interval is not evidence of method equivalence.</text>
<text x="55.0" y="686.0" font-size="17" font-weight="650" text-anchor="start" fill="#8A3B32">Exploratory · CAUTION · only 3 counterfactual parent clusters</text>
</svg>
